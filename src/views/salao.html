<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salão - KDS Bridge</title>
    <script>document.documentElement.setAttribute('data-theme', 'dark');</script>
    <link rel="stylesheet" href="/styles/theme.css">
    <script src="/scripts/station-theme.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/security.js"></script>
    <script src="/scripts/gerente-nav.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 64px var(--sp-5) var(--sp-5);
            font-size: 14px;
            background: var(--c-bg-page);
            color: var(--c-text-body);
            min-height: 100vh;
            display: flex; flex-direction: column; gap: var(--sp-4);
        }

        h2, h3 { margin: 0 0 var(--sp-3) 0; font-weight: var(--fw-bold); color: var(--c-text-body); letter-spacing: -0.02em; }

        select, input, button {
            font-family: var(--font-sans);
            border-radius: var(--radius-md);
            transition: all var(--t-fast) var(--ease-out);
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            border: 1px solid var(--c-border-light);
            background: var(--c-bg-panel);
            color: var(--c-text-body);
        }
        input:focus, select:focus {
            border-color: var(--c-accent-gold);
            outline: none;
            box-shadow: 0 0 0 1px var(--c-accent-gold);
        }

        button {
            width: 100%;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: var(--fw-bold);
            letter-spacing: 0.3px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            min-height: 48px;
            text-transform: uppercase;
            transition: all var(--t-fast) var(--ease-out);
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .row { display: flex; gap: var(--sp-3); }
        .row > * { flex: 1; }

        .top-header {
            position: fixed; top: 0; left: 0; right: 0;
            z-index: var(--z-sticky);
            background: var(--c-primary);
            color: var(--c-text-invert);
            padding: 12px 20px;
            display: flex; align-items: center; justify-content: center; gap: var(--sp-3);
            font-size: 12px; font-weight: var(--fw-medium); letter-spacing: 0.5px;
            border-bottom: 1px solid var(--c-border-dark);
        }
        .top-header .header-sep { opacity: 0.4; }
        .top-header #headerMenu { font-weight: var(--fw-bold); font-size: 13px; letter-spacing: 0.2px; }

        #toast {
            position: fixed; top: 60px; left: 50%; transform: translate(-50%, -10px);
            background: var(--c-danger); color: white;
            padding: 12px 16px; border-radius: var(--radius-md);
            font-size: 13px; font-weight: var(--fw-medium);
            opacity: 0; pointer-events: none; transition: all var(--t-base) var(--ease-out);
            z-index: var(--z-toast); box-shadow: var(--shadow-elevated);
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        #toast.success { background: var(--c-accent-warm); }

        .product-search-wrapper { position: relative; }
        .product-search-wrapper > input { margin-bottom: 0; padding-right: 36px; }
        #replacedSearch[readonly] { cursor: default; }
        .product-dropdown {
            display: none; position: absolute; top: 100%; left: 0; right: 0;
            background: var(--c-bg-panel); border: 1px solid var(--c-border-default);
            border-top: none; border-radius: 0 0 var(--radius-md) var(--radius-md);
            max-height: 320px; overflow-y: auto; z-index: 90;
            box-shadow: var(--shadow-elevated);
        }
        .product-dropdown.open { display: block; }
        .product-option {
            padding: 12px 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
            border-bottom: 1px solid var(--c-border-light);
        }
        .product-option:last-child { border-bottom: none; }
        .product-option:hover { background: var(--c-primary-tint); }
        .product-option .opt-name { font-weight: var(--fw-semi); font-size: 13px; }
        .product-option .opt-cat { font-size: 11px; color: var(--c-text-muted); }
        .today-badge {
            background: var(--c-primary); color: var(--c-text-invert);
            font-size: 9px; font-weight: var(--fw-bold); padding: 2px 6px; border-radius: var(--radius-sm);
        }

        .retrieve-btn { background-color: var(--c-accent-warm); color: var(--c-on-primary); width: auto; padding: 10px 16px; font-size: 12px; min-height: 40px;}
        .cancel-btn { background-color: var(--c-bg-panel); border: 1px solid var(--c-border-default); color: var(--c-danger); width: auto; padding: 10px 16px; font-size: 12px; min-height: 40px;}
        .stockout-btn { background-color: transparent; border: 1px solid var(--c-warn); color: var(--c-warn); width: auto; padding: 10px 16px; font-size: 12px; min-height: 40px;}

        .section {
            background: var(--c-bg-panel); border-radius: var(--radius-lg);
            padding: var(--sp-5); border: 1px solid var(--c-border-default);
        }

        form button[type="submit"] {
            background: linear-gradient(180deg, var(--c-accent-warm) 0%, #059669 100%);
            color: white; margin-top: var(--sp-3);
            width: 100%; min-height: 56px;
            font-size: 15px; font-weight: 700;
            border-radius: 10px; border: none;
            box-shadow: var(--shadow-btn-3d-light);
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        form button[type="submit"]:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.15); }

        .demand-list { display: flex; flex-direction: column; gap: var(--sp-3); }

        .demand-card {
            background: var(--c-bg-panel); border-radius: var(--radius-lg);
            padding: var(--sp-4); border: 1px solid var(--c-border-default);
            display: flex; flex-direction: column; gap: var(--sp-3);
        }
        .demand-card.pending { border-left: 3px solid var(--c-accent-gold); }
        .demand-card.ready { border-left: 3px solid var(--c-accent-warm); background: var(--alert-ok-bg-dark); }
        .demand-card.urgent { border-left: 3px solid var(--c-danger); background: var(--alert-urgent-bg-dark); }
        .demand-card.stockout { border-left: 3px solid var(--c-warn); background: var(--alert-warn-bg-dark); }
        :root[data-theme="light"] .demand-card.ready { background: var(--alert-ok-bg-light); }
        :root[data-theme="light"] .demand-card.urgent {
            background: var(--alert-urgent-bg-light);
            border-left: 6px solid var(--c-danger);
            animation: urgentPulse 1.1s ease-in-out infinite;
        }
        :root[data-theme="light"] .demand-card.stockout {
            background: var(--alert-warn-bg-light);
            border-left: 6px solid var(--c-warn);
            animation: stockoutPulse 1.1s ease-in-out infinite;
        }
        :root[data-theme="light"] .demand-card.urgent .name,
        :root[data-theme="light"] .demand-card.stockout .name { font-size: 19px; font-weight: 800; }
        :root[data-theme="light"] .top-header { background: var(--c-primary); color: var(--c-on-primary); border-bottom-color: var(--c-primary); }

        @keyframes urgentPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.01); opacity: 0.92; }
        }
        @keyframes stockoutPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.85; }
        }

        .demand-card .name { font-weight: var(--fw-bold); font-size: 16px; display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap;}
        .demand-card .meta { font-size: 12px; color: var(--c-text-muted); }
        .demand-card .eta { font-size: 13px; font-weight: var(--fw-semi); font-family: var(--font-mono); }
        .demand-card .eta.overdue { color: var(--c-danger); }
        .demand-card .actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); justify-content: flex-end; flex-wrap: wrap; }
        .demand-card .actions button {
            min-height: 48px; min-width: 110px; padding: 12px 20px;
            font-size: 14px; font-weight: 700;
            border-radius: 10px; border: 1px solid var(--c-border-default);
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.4px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.08); transition: transform 0.1s, box-shadow 0.1s;
            font-family: inherit;
        }
        .demand-card .actions button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.08); }
        .demand-card .actions .retrieve-btn { background: linear-gradient(180deg, var(--c-accent-warm) 0%, #059669 100%); color: var(--c-on-primary); border-color: rgba(255,255,255,0.12); box-shadow: var(--shadow-btn-3d-light); }
        .demand-card .actions .retrieve-btn:active { box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
        .demand-card .actions .cancel-btn { background: var(--c-bg-panel); color: var(--c-danger); border-color: rgba(225,29,72,0.3); }
        .demand-card .actions .cancel-btn:hover, .demand-card .actions .cancel-btn:active { background: var(--c-danger); color: var(--c-text-invert); border-color: var(--c-danger); }
        .demand-card .actions .stockout-btn:hover,
        .demand-card .actions .stockout-btn:focus,
        .demand-card .actions .stockout-btn:active { background: var(--c-warn); color: var(--c-primary); border-color: var(--c-warn); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }

        .badge {
            display: inline-block; padding: 2px 8px; border-radius: var(--radius-pill);
            font-size: 9px; font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 0.5px;
        }
        .badge.urgent { background: var(--c-danger); color: var(--c-text-invert); }
        .badge.normal { background: var(--c-bg-page); color: var(--c-text-secondary); border: 1px solid var(--c-border-default); }
        .badge.ready-badge { background: var(--c-accent-warm); color: var(--c-text-invert); }
        .badge.stockout-badge { background: var(--c-warn); color: var(--c-primary); }
        .badge.cancelled-badge { background: var(--c-warn); color: var(--c-primary); }
        .demand-card.cancelled-notice {
            border: 2px solid var(--c-warn);
            background: var(--alert-warn-bg-dark);
        }
        :root[data-theme="light"] .demand-card.cancelled-notice { background: var(--alert-warn-bg-light); }
        .demand-card .actions .replace-btn { background: linear-gradient(180deg, var(--c-accent-warm) 0%, #059669 100%); color: var(--c-on-primary); border-color: rgba(255,255,255,0.12); }
        .demand-card .actions .dismiss-btn { background: var(--c-bg-panel); color: var(--c-text-secondary); }

        :root body[data-shift="dinner"] { background: var(--dinner-bg); color: #f3ede1; }
        :root body[data-shift="dinner"] .top-header { background: #1e1b24; border-bottom: 1px solid rgba(243, 237, 225, 0.14); }
        :root body[data-shift="dinner"] .top-header .kds-title,
        :root body[data-shift="dinner"] .top-header #headerDate,
        :root body[data-shift="dinner"] .top-header #headerMenu { color: var(--dinner-accent); }
        :root body[data-shift="dinner"] .section { background: transparent; border-color: transparent; }
        :root body[data-shift="dinner"] .section h2,
        :root body[data-shift="dinner"] .section h3 { color: var(--dinner-accent); }
        :root body[data-shift="dinner"] #demandForm label { color: var(--dinner-accent); }
        :root body[data-shift="dinner"] form button[type="submit"] { background: linear-gradient(180deg, var(--dinner-accent) 0%, #b07a45 100%); color: #0b1020; }
        /* Navegação lateral no jantar: mesmo painel escuro da cozinha. */
        :root body[data-shift="dinner"] #gerenteNav { background: #1e1b24; border-right: 1px solid rgba(243, 237, 225, 0.12); }
        :root body[data-shift="dinner"] #gerenteNav .gnav-link { color: #f3ede1; }
        :root body[data-shift="dinner"] #gerenteNav .gnav-toggle { color: var(--dinner-accent); }
        :root body[data-shift="dinner"] #gerenteNav .gnav-link:hover,
        :root body[data-shift="dinner"] #gerenteNav .gnav-link.active { background: rgba(243, 237, 225, 0.06); border-color: rgba(243, 237, 225, 0.25); color: #f3ede1; }
        :root body[data-shift="dinner"] #gerenteNav .gnav-toggle:hover { background: rgba(243, 237, 225, 0.06); color: #f3ede1; }
        /* Dropdowns de produto no jantar: painel escuro. */
        :root body[data-shift="dinner"] .product-search-wrapper > input,
        :root body[data-shift="dinner"] #quantity,
        :root body[data-shift="dinner"] #unitSelect { background: #1e1b24; border-color: rgba(243, 237, 225, 0.16); color: #f3ede1; }
        :root body[data-shift="dinner"] .product-search-wrapper > input::placeholder { color: rgba(243, 237, 225, 0.45); }
        :root body[data-shift="dinner"] .product-dropdown { background: #1e1b24; border-color: rgba(243, 237, 225, 0.16); }
        :root body[data-shift="dinner"] .product-option { border-bottom-color: rgba(243, 237, 225, 0.08); }
        :root body[data-shift="dinner"] .product-option:hover { background: rgba(243, 237, 225, 0.06); }
        :root body[data-shift="dinner"] .product-option .opt-name { color: #f3ede1; }
        :root body[data-shift="dinner"] .product-option .opt-cat { color: var(--dinner-accent); }
        :root body[data-shift="dinner"] .product-empty { color: var(--dinner-accent); }
        /* Cards no jantar: mesmo painel da cozinha jantar; status com a cor forte. */
        :root body[data-shift="dinner"] .demand-card { background: var(--dinner-surface); border: 1px solid rgba(243, 237, 225, 0.14); }
        :root body[data-shift="dinner"] .demand-card .name { color: #f3ede1; }
        :root body[data-shift="dinner"] .demand-card .meta { color: var(--dinner-accent); }
        :root body[data-shift="dinner"] .demand-card .eta { color: #f3ede1; }
        :root body[data-shift="dinner"] .demand-card.ready { background: #022c22; border-color: rgba(52, 211, 153, 0.5); border-left: 4px solid #34d399; }
        :root body[data-shift="dinner"] .demand-card.urgent { background: #4c0519; border-color: rgba(225, 29, 72, 0.55); border-left: 6px solid var(--c-danger); animation: urgentPulse 1.1s ease-in-out infinite; }
        :root body[data-shift="dinner"] .demand-card.urgent .name,
        :root body[data-shift="dinner"] .demand-card.stockout .name { font-size: 19px; font-weight: 800; color: #ffffff; }
        :root body[data-shift="dinner"] .demand-card.stockout,
        :root body[data-shift="dinner"] .demand-card.cancelled-notice { background: #451a03; border: 2px solid var(--c-warn); border-left-width: 6px; animation: stockoutPulse 1.1s ease-in-out infinite; }
        :root body[data-shift="dinner"] .demand-card.stockout .name { color: #ffffff; }
        /* Ações no jantar: linguagem da cozinha (primária dourada, perigo claro). */
        :root body[data-shift="dinner"] .demand-card .actions .retrieve-btn { background: var(--dinner-accent); color: #141218; border-color: var(--dinner-accent); box-shadow: none; }
        :root body[data-shift="dinner"] .demand-card .actions .cancel-btn { background: transparent; color: #fb7185; border-color: rgba(251, 113, 133, 0.5); box-shadow: none; }
        :root body[data-shift="dinner"] .demand-card .actions .cancel-btn:hover { background: var(--c-danger); color: #fff; border-color: var(--c-danger); }
        :root body[data-shift="dinner"] .demand-card .actions .stockout-btn { background: var(--dinner-accent); color: #141218; border-color: var(--dinner-accent); box-shadow: none; }
        :root body[data-shift="dinner"] .demand-card .actions .replace-btn { background: var(--dinner-accent); color: #141218; border-color: var(--dinner-accent); box-shadow: none; }
        :root body[data-shift="dinner"] .demand-card .actions .dismiss-btn { background: transparent; color: #f3ede1; border-color: rgba(243, 237, 225, 0.4); box-shadow: none; }
        :root body[data-shift="dinner"] #shiftBadge { background: var(--dinner-accent); color: #0b1020; }
        :root body[data-shift="dinner"] .empty-state { color: var(--dinner-accent); }
        /* ZEROU legível também fora do jantar: âmbar escuro no tema claro. */
        :root[data-theme="light"] .demand-card .actions .stockout-btn { color: #92400e; border-color: #92400e; }

        .empty-state { text-align: center; color: var(--c-text-muted); padding: var(--sp-6) 0; font-size: 13px; }

        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(9, 9, 11, 0.8); z-index: var(--z-modal);
            justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--c-surface); padding: var(--sp-5); border-radius: var(--radius-xl);
            max-width: 400px; width: 90%; border: 1px solid var(--c-border-light);
            box-shadow: var(--shadow-elevated);
        }
        .modal h3 { font-size: 16px; margin-bottom: var(--sp-4); }
        .modal textarea {
            width: 100%; padding: 12px; font-size: 14px;
            border-radius: var(--radius-md); border: 1px solid var(--c-border-light);
            margin-bottom: var(--sp-4); font-family: inherit; resize: vertical;
        }
        .modal textarea:focus { border-color: var(--c-text); outline: none; }
        .modal button { width: 100%; margin-bottom: var(--sp-2); min-height: 52px; font-size: 14px; font-weight: 700; border-radius: 10px; }
        .modal button:last-child { margin-bottom: 0; background: transparent; color: var(--c-text-muted); border: 1px solid var(--c-border-light); }

        label { display: flex; align-items: center; margin-bottom: var(--sp-4); font-size: 13px; font-weight: var(--fw-medium); cursor: pointer; }
        input[type="checkbox"] { width: auto; margin-right: var(--sp-2); accent-color: var(--c-primary); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-border-light); border-radius: 2px; }

        @media (max-width: 768px) {
            body { padding: 56px var(--sp-3) var(--sp-3); }
        }
    </style>
</head>
<body>
    <div class="top-header" id="topHeader">
        <span id="headerDate">—</span>
        <span class="header-sep">·</span>
        <span id="headerMenu">—</span>
        <span class="header-sep" id="shiftSep" style="display:none;">·</span>
        <span id="shiftBadge" class="badge-pill badge-dinner" style="display:none;">Turno Jantar ativo</span>
    </div>

    <div id="toast" role="alert"></div>

    <div class="section">
        <h2>Registrar Demanda</h2>
        <form id="demandForm">
            <div class="product-search-wrapper" id="productSearchWrapper">
                <input type="search" id="productSearch" placeholder="Buscar produto..." autocomplete="off">
                <select id="productSelect" style="display:none;"></select>
                <div class="product-dropdown" id="productDropdown"></div>
            </div>
            <div class="row">
                <input type="number" id="quantity" class="mono" placeholder="Qtd" value="1" min="1" required style="max-width: 80px;">
                <select id="unitSelect" disabled>
                    <option value="">Unidade</option>
                </select>
            </div>
            <div style="display:flex; gap: 20px; margin-bottom: var(--sp-4);">
                <label><input type="checkbox" id="isUrgent"> Urgente</label>
                <label><input type="checkbox" id="isReplacement"> Troca</label>
            </div>
            <select id="replacedProduct" style="display:none;"></select>
            <div class="product-search-wrapper" id="replacedSearchWrapper" style="display:none;">
                <input type="search" id="replacedSearch" placeholder="Buscar item substituído..." autocomplete="off">
                <div class="product-dropdown" id="replacedDropdown"></div>
            </div>
            <button type="submit">Enviar para Cozinha</button>
        </form>
    </div>

    <div class="section" style="flex: 1;">
        <h3>Demandas Ativas</h3>
        <div id="demandList" class="demand-list">
            <div class="empty-state">Nenhuma demanda ativa no momento.</div>
        </div>
    </div>

    <div id="cancelModal" class="modal-overlay">
        <div class="modal">
            <h3>Cancelar Demanda</h3>
            <select id="cancelReasonSelect" style="margin-bottom: 8px;"></select>
            <textarea id="cancelReason" rows="2" placeholder="Descreva o motivo (obrigatório se não selecionar acima)"></textarea>
            <div style="display:flex; flex-direction: column; gap: 8px;">
                <button id="confirmCancelBtn" style="background: var(--c-danger); color: white;">Confirmar Cancelamento</button>
                <button id="closeCancelModal">Fechar</button>
            </div>
        </div>
    </div>

    <div id="confirmModal" class="modal-overlay">
        <div class="modal">
            <h3>Confirmar Retirada</h3>
            <p id="confirmModalText" style="font-size: 14px; margin-bottom: 16px;">Confirmar retirada?</p>
            <div style="display:flex; flex-direction: column; gap: 8px;">
                <button id="confirmRetrieveBtn" style="background: var(--c-accent-warm); color: white;">Sim, Confirmar Retirada</button>
                <button id="closeConfirmModal">Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        if (!kdsGuard()) throw new Error('redirecionando para login');
        const stationSocket = kdsSocket(io);
        stationSocket.emit('join', 'salao');
        KDSStationTheme.watch(stationSocket, 'salao');
        KDSStationTheme.load('salao');
(function() {
    var socket = kdsSocket(io);
    socket.emit('identify', 'salao');
    var demands = [];
    var products = [];
    var todayMenuProducts = [];
    var units = [];
    var cancelTargetId = null;
    var retrieveTargetId = null;
    var cancelReasons = [];
    var cancelledNotices = [];
    var replaceNoticeId = null;
    var timeInterval;
    var searchTimeout = null;
    var toastTimeout = null;
    var currentShift = 'lunch';

    function updateShiftBadge() {
        var badge = document.getElementById('shiftBadge');
        var sep = document.getElementById('shiftSep');
        if (!badge) return;
        var active = currentShift === 'dinner';
        badge.style.display = active ? '' : 'none';
        if (sep) sep.style.display = active ? '' : 'none';
        document.body.setAttribute('data-shift', active ? 'dinner' : 'lunch');
    }

    function toDate(v) {
        if (!v) return new Date();
        if (v instanceof Date) return isNaN(v.getTime()) ? new Date() : v;
        if (typeof v === 'number') return new Date(v);
        var s = String(v).trim();
        if (!s) return new Date();
        var d = new Date(s);
        if (!isNaN(d.getTime())) return d;
        d = new Date(s.replace(' ', 'T'));
        if (!isNaN(d.getTime())) return d;
        d = new Date(s.replace(' ', 'T').replace(/([+-]\d{2}):?(\d{2})$/, '') + 'Z');
        if (!isNaN(d.getTime())) return d;
        return new Date();
    }

    function timeAgo(d) {
        var diff = Math.floor((Date.now() - toDate(d).getTime()) / 1000);
        if (diff < 0) diff = 0;
        if (diff < 60) return 'agora';
        var min = Math.floor(diff / 60);
        if (min < 60) return 'há ' + min + ' min';
        var h = Math.floor(min / 60);
        return 'há ' + h + 'h ' + (min % 60) + 'min';
    }

    function etaDisplay(d) {
        if (!d) return '';
        var remaining = Math.ceil((toDate(d).getTime() - Date.now()) / 60000);
        if (remaining <= 0) return '<span style="color:var(--c-danger);font-weight:var(--fw-bold);">Atrasado</span>';
        return '~' + remaining + ' min';
    }

    function fmtHourMin(dateStr) {
        if (!dateStr) return '';
        return toDate(dateStr).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }

    function upsertCancelledNotice(d) {
        cancelledNotices = cancelledNotices.filter(function(x) { return x.id !== d.id; });
        cancelledNotices.unshift(d);
        renderDemands();

    function dismissCancelledNotice(id) {
        if (!id) return;
        markNoticeSeen(id);
        cancelledNotices = cancelledNotices.filter(function(x) { return x.id !== id; });

    // Avisos já resolvidos nesta tela (Esquecer ou troca enviada): ficam no
    // localStorage para não reaparecerem após F5. O servidor lista os
    // cancelamentos do dia e a tela filtra esses ids.
    var SEEN_NOTICE_KEY = 'kds_cancelled_seen';
    function getSeenNoticeIds() {
        try {
            var raw = localStorage.getItem(SEEN_NOTICE_KEY);
            var arr = raw ? JSON.parse(raw) : [];
            return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
    }
    function markNoticeSeen(id) {
        if (!id) return;
        try {
            var seen = getSeenNoticeIds();
            if (seen.indexOf(id) === -1) {
                seen.push(id);
                localStorage.setItem(SEEN_NOTICE_KEY, JSON.stringify(seen.slice(-200)));
            }
        } catch (e) { /* sem localStorage, o aviso volta no F5 */ }
    }
    function loadCancelledNotices() {
        var seen = getSeenNoticeIds();
        api('/api/v1/demands/cancelled-cozinha').then(function(rows) {
            (rows || []).forEach(function(d) {
                if (d && d.id && seen.indexOf(d.id) === -1) upsertCancelledNotice(d);

    function renderDemands() {
        var container = document.getElementById('demandList');
        if (!container) return;
        var active = demands.filter(function(d) { return d.status === 'pending' || d.status === 'ready'; });
        if (active.length === 0 && cancelledNotices.length === 0) {
            container.innerHTML = '<div class="empty-state">Nenhuma demanda ativa.</div>';
            return;
        }
        active.sort(function(a, b) {
            var aReady = a.status === 'ready';
            var bReady = b.status === 'ready';
            if (aReady && !bReady) return -1;
            if (!aReady && bReady) return 1;
            if (aReady && bReady) {
                var aReadyAt = a.ready_at ? toDate(a.ready_at).getTime() : toDate(a.created_at).getTime();
                var bReadyAt = b.ready_at ? toDate(b.ready_at).getTime() : toDate(b.created_at).getTime();
                return aReadyAt - bReadyAt;
            }
            var aUrgent = a.priority === 'urgent';
            var bUrgent = b.priority === 'urgent';
            if (aUrgent && !bUrgent) return -1;
            if (!aUrgent && bUrgent) return 1;
            return toDate(a.created_at).getTime() - toDate(b.created_at).getTime();
        });

        container.innerHTML = cancelledNotices.map(function(d) {
            var unitText = d.unit_label ? ' (' + esc(d.unit_label) + ')' : '';
            var qtyText = (typeof d.quantity === 'number' ? d.quantity : parseFloat(d.quantity) || d.quantity) + 'x';
            var reason = d.cancel_reason ? esc(d.cancel_reason) : 'Sem motivo';
            var when = d.cancelled_at ? timeAgo(d.cancelled_at) : timeAgo(d.created_at);
            return '<div class="demand-card cancelled-notice">' +
                '<div class="info">' +
                    '<div class="name">' + qtyText + ' ' + esc(d.product_name) + unitText + ' ' +
                        '<span class="badge cancelled-badge">CANCELADA PELA COZINHA</span></div>' +
                    '<div class="meta">Motivo: ' + reason + ' · ' + when + '</div>' +
                '</div>' +
                '<div class="actions">' +
                    '<button class="replace-btn" data-id="' + d.id + '">Trocar</button>' +
                    '<button class="dismiss-btn" data-id="' + d.id + '">Esquecer</button>' +
                '</div>' +
            '</div>';
        }).join('') + active.map(function(d) {
            var isReady = d.status === 'ready';
            var cls = isReady ? 'ready' : (d.priority === 'urgent' ? 'urgent' : 'pending');
            if (d.stockout_reported) cls += ' stockout';
            var unitText = d.unit_label ? ' (' + esc(d.unit_label) + ')' : '';
            var qtyText = (typeof d.quantity === 'number' ? d.quantity : parseFloat(d.quantity) || d.quantity) + 'x';
            var badges = d.priority === 'urgent'
                ? '<span class="badge urgent">URGENTE</span>'
                : '';
            if (isReady) badges += '<span class="badge ready-badge">PRONTO</span>';
            if (d.stockout_reported) {
                var stockoutTime = d.stockout_reported_at ? fmtHourMin(d.stockout_reported_at) : '';
                badges += '<span class="badge stockout-badge">ZERADO' + (stockoutTime ? ' às ' + stockoutTime : '') + '</span>';
            }

            var actions = '';
            if (!isReady) {
                actions = '<button class="cancel-btn" data-id="' + d.id + '">Cancelar</button>' +
                          '<button class="stockout-btn" data-id="' + d.id + '">Zerou</button>';
            } else {
                actions = '<button class="retrieve-btn" data-id="' + d.id + '">Retirar</button>';
            }

            return '<div class="demand-card ' + cls + '">' +
                '<div class="info">' +
                    '<div class="name">' + qtyText + ' ' + esc(d.product_name) + unitText + ' ' + badges + '</div>' +
                    '<div class="meta">' + timeAgo(d.created_at) + '</div>' +
                    (d.expected_ready_at ? '<div class="eta">ETA ' + etaDisplay(d.expected_ready_at) + '</div>' : '') +
                '</div>' +
                '<div class="actions">' + actions + '</div>' +
            '</div>';
        }).join('');

        if (timeInterval) clearInterval(timeInterval);
        timeInterval = setInterval(function() { renderDemands(); }, 30000);
    }

            if (!res.ok) {
                return res.json().then(function(err) {
                    throw new Error(err.error || ('Erro ' + res.status));
                }, function() {
                    throw new Error('Erro ' + res.status);
                });
            }
            return res.json();
        });
    }

    function updateHeader(data) {
        var dateEl = document.getElementById('headerDate');

        if (data && data.date) {
            var parts = String(data.date).split('-');

                var parsed = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                if (!isNaN(parsed.getTime())) d = parsed;
            }
        }
        if (!d) d = new Date();
        var dateStr = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
        dateStr = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        dateEl.textContent = dateStr;

        if (data && data.menu) {

    function sortProductItems(items) {
        return (items || []).slice().sort(function(a, b) {
            var aj = (a.station_code === 'jantar') ? 1 : 0;
            var bj = (b.station_code === 'jantar') ? 1 : 0;
            if (aj !== bj) return bj - aj;
            var at = a.in_today_menu ? 1 : 0;
            var bt = b.in_today_menu ? 1 : 0;
            if (at !== bt) return bt - at;
            return a.name.localeCompare(b.name);
        });
    }

    // Fábrica de dropdown de produto: mesma ordenação, selo e marcação para
    // o campo principal e para a busca do item substituído (troca).
    // cfg: { inputId, dropdownId, wrapperId, initialItems(), onPick(item) }
    function makeProductDropdown(cfg) {
        var dropdown = document.getElementById(cfg.dropdownId);
        var input = document.getElementById(cfg.inputId);
        var wrapper = document.getElementById(cfg.wrapperId);
        var state = { items: [] };
        function setItems(items) {
            state.items = sortProductItems(items);
            if (!dropdown) return;
            if (state.items.length === 0) {
                dropdown.innerHTML = '<div class="product-empty">Nenhum produto encontrado</div>';
                dropdown.classList.add('open');
                return;
            }
            dropdown.innerHTML = state.items.map(function(p, i) {
                var badge = p.station_code === 'jantar'
                    ? '<span class="today-badge badge-jantar">JANTAR</span>'
                    : (p.in_today_menu
                        ? (currentShift === 'dinner' ? '<span class="today-badge">ALMOÇO</span>' : '<span class="today-badge">HOJE</span>')
                        : '');
                return '<div class="product-option" data-idx="' + i + '">' +
                    '<span><span class="opt-name">' + esc(p.name) + '</span>' +
                    (p.category ? '<span class="opt-cat">' + esc(p.category) + '</span>' : '') +
                    '</span>' + badge +
                '</div>';
            }).join('');
            dropdown.classList.add('open');
        }
        function open() { setItems(cfg.initialItems ? cfg.initialItems() : []); }
        function close() { if (dropdown) dropdown.classList.remove('open'); }
        if (input) input.addEventListener('focus', function() { if (!input.readOnly) open(); });
        if (dropdown) dropdown.addEventListener('click', function(e) {
            var t = e.target;
            var optEl = (t && t.closest) ? t.closest('.product-option') : null;
            if (!optEl) return;
            var idx = parseInt(optEl.dataset.idx, 10);
            if (!isNaN(idx) && state.items[idx]) cfg.onPick(state.items[idx]);
        });
        document.addEventListener('click', function(e) {
            if (wrapper && !wrapper.contains(e.target)) close();
        });
        return { setItems: setItems, open: open, close: close };
    }

            unit_label: unitLabel || undefined,
            priority: document.getElementById('isUrgent').checked ? 'urgent' : 'normal'
        };
        var repl = document.getElementById('isReplacement');
        if (repl && repl.checked) {
            payload.is_replacement = true;
            var replSelect = document.getElementById('replacedProduct');
            payload.replaced_product_id = replSelect ? replSelect.value : '';
        }
        if (btn) {
            btn.disabled = true;
            btn.textContent = 'Enviando...';
        }
        api('/api/v1/demands', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(function(created) {
            if (created && created.product_name) {
                var qty = (typeof created.quantity === 'number' ? created.quantity : parseFloat(created.quantity) || created.quantity);
                var msg = 'Demanda registrada: ' + qty + 'x ' + created.product_name;
                if (created.sla_minutes) msg += ' — pronto em ~' + created.sla_minutes + ' min';
                showToast(msg, 'success');
            } else {
                showToast('Demanda registrada com sucesso.', 'success');
            }
            document.getElementById('quantity').value = 1;
            document.getElementById('isUrgent').checked = false;
            var searchInput = document.getElementById('productSearch');
            if (searchInput) searchInput.value = '';
            var productSelectMain = document.getElementById('productSelect');
            if (productSelectMain) {
                productSelectMain.value = '';
                productSelectMain.style.display = 'none';
            }
            var unitSelectReset = document.getElementById('unitSelect');
            if (unitSelectReset) unitSelectReset.value = '';
            var repl2 = document.getElementById('isReplacement');
            if (repl2) repl2.checked = false;
            var replSelect2 = document.getElementById('replacedProduct');
            if (replSelect2) {
                replSelect2.value = '';
                replSelect2.style.display = 'none';
            }
            var replSearchReset = document.getElementById('replacedSearch');
            if (replSearchReset) { replSearchReset.value = ''; replSearchReset.readOnly = false; }
            var replWrapperReset = document.getElementById('replacedSearchWrapper');
            if (replWrapperReset) replWrapperReset.style.display = 'none';
            replacedDD.close();
            if (replaceNoticeId) dismissCancelledNotice(replaceNoticeId);
        }).catch(function(err) {
            console.error(err);
            showToast(err.message);
        }).finally(function() {
            if (btn) {
                btn.disabled = false;
                btn.textContent = 'Enviar para Cozinha';
            }
        });
    });

    socket.on('demand:new', function(d) { demands.push(d); renderDemands(); });
    socket.on('demand:urgent', function(d) { demands.push(d); renderDemands(); });
    socket.on('demand:ready', function(d) {
        var idx = demands.findIndex(function(x) { return x.id === d.id; });
        if (idx !== -1) demands[idx] = d; else demands.push(d);
        renderDemands();
    });
    socket.on('demand:retrieved', function(d) { demands = demands.filter(function(x) { return x.id !== d.id; }); if (d && d.id) dismissCancelledNotice(d.id); else renderDemands(); });
    socket.on('demand:cancelled', function(d) {
        demands = demands.filter(function(x) { return x.id !== d.id; });
        if (d && d.status === 'cancelled_cozinha') {
            showToast('A cozinha cancelou: ' + (d.quantity || '') + 'x ' + (d.product_name || 'item'));
            upsertCancelledNotice(d);
        } else {
            renderDemands();
        }
    });
    socket.on('demand:stockout', function(d) {
        var idx = demands.findIndex(function(x) { return x.id === d.id; });
        if (idx !== -1) demands[idx] = d;
        renderDemands();
    });
    socket.on('demand:queue-updated', loadActiveDemands);
    socket.on('demand:cross-cancel', function(d) {
        if (d && d.id) {
            demands = demands.filter(function(x) { return x.id !== d.id; });
        }
        if (d && d.cancelled_by === 'cozinha') {
            showToast('A cozinha cancelou um item que já estava em preparo');
            upsertCancelledNotice(d);
        } else {
            renderDemands();
        }
    });
    socket.on('demand:annulled', function(d) {
        if (d && d.id) {
            demands = demands.filter(function(x) { return x.id !== d.id; });
            dismissCancelledNotice(d.id);
        } else {
            renderDemands();
        }
    });
    socket.on('menu:updated', function() { loadProducts(); });
    socket.on('shift:updated', function(data) {
        currentShift = (data && data.shift === 'dinner') ? 'dinner' : 'lunch';
        loadProducts();
    });
    socket.on('connect', function() { socket.emit('identify', 'salao'); loadActiveDemands(); });

    loadProducts();
    loadUnitsForProduct('');
    loadCancelReasons();
    loadActiveDemands();
})();
</script>
</body>
</html>
