<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cozinha - KDS Bridge</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #222; color: white; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .card { background: #333; padding: 20px; border-radius: 8px; font-size: 24px; text-align: center; }
        .card.urgent { background: #dc3545; animation: pulse 1.5s infinite; } /* Destaque urgente [cite: 87] */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.8; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <h1>Demandas Ativas</h1>
    <div id="demandsGrid" class="grid"></div>

    <script>
        const socket = io();
        let demands = []; 
        const alertSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        socket.emit('identify', 'cozinha');

        async function carregarDemandasPendentes() {
            try {
                // Chama a rota GET /api/demands que criamos no backend
                const response = await fetch('/api/demands');
                const pendentes = await response.json();
                
                // Sobrescreve o array vazio local com os dados reais do SQLite
                demands = pendentes; 
                
                // Desenha os cards na tela
                render();
            } catch (error) {
                console.error('Falha ao buscar fila do banco:', error);
            }
        }

        // Executa a carga inicial assim que a tela abre
        carregarDemandasPendentes();

        function render() {
            const grid = document.getElementById('demandsGrid');
            
            const sortedDemands = demands.sort((a, b) => {
                if (a.priority === 'urgent' && b.priority !== 'urgent') return -1;
                if (a.priority !== 'urgent' && b.priority === 'urgent') return 1;
                return new Date(a.created_at) - new Date(b.created_at);
            });

            grid.innerHTML = sortedDemands.map(d => `
                <div class="card ${d.priority}">
                    <strong>${d.quantity}x</strong><br>
                    ${d.product_name}
                </div>
            `).join('');
        }

        socket.on('demand:new', (demand) => {
            console.log('[Receptor] Pacote recebido via Socket:', demand);
            demands.push(demand);
            render();
        });

        socket.on('demand:urgent', (demand) => {
            demands.push(demand);
            render();
            alertSound.play().catch(e => console.log('O navegador bloqueou o autoplay de áudio.'));
        });

        socket.on('demand:updated', (updatedDemand) => {
            if (updatedDemand.status === 'completed' || updatedDemand.status === 'cancelled') {
                demands = demands.filter(d => d.id !== updatedDemand.id);
                render();
            }
        });
    </script>
</body>
</html>
