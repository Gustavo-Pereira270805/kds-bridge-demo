<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cozinha - KDS Bridge</title>
    <link rel="stylesheet" href="/styles/theme.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: var(--c-bg-dark); color: var(--c-text-invert); 
            padding: var(--sp-5); min-height: 100vh;
            display: flex; flex-direction: column;
        }

        .reconnect-banner {
            display: none; background: var(--c-warn); color: var(--c-primary);
            text-align: center; padding: 8px 16px; font-weight: var(--fw-semi); font-size: 13px;
            margin-bottom: var(--sp-4); border-radius: var(--radius-md);
        }

        h1 {
            font-size: 15px; font-weight: var(--fw-bold); margin-bottom: var(--sp-5); text-align: center;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--c-text-invert-muted); padding-bottom: var(--sp-3); 
            border-bottom: 1px solid var(--c-border-dark);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--sp-4);
            flex: 1;
        }

        .card {
            background: var(--c-surface-dark); padding: var(--sp-4); border-radius: var(--radius-lg);
            border: 1px solid var(--c-border-dark); position: relative;
            display: flex; flex-direction: column; gap: var(--sp-3);
        }

        .card.urgent { 
            background: var(--alert-urgent-bg-dark); 
            border: 1px solid rgba(225, 29, 72, 0.3); 
        }
        .card.breached { border-color: rgba(245, 158, 11, 0.5); }
        .card.cooking { background: var(--alert-ok-bg-dark); border-color: rgba(16, 185, 129, 0.3); }
        .card.late { background: #180a0a; border-color: rgba(225, 29, 72, 0.5); }
        .card.critical { background: #2d0a0a; border: 1px solid rgba(225, 29, 72, 0.8); }
        .card.stockout { background: #1a1306; border: 1px solid rgba(245, 158, 11, 0.6); }

        .card .urgent-label {
            font-size: 10px; font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 1px;
            color: var(--c-danger); margin-bottom: var(--sp-1);
        }

        .card .card-top { display: flex; align-items: flex-start; gap: var(--sp-3); }

        .card .qty {
            font-size: 32px; font-family: var(--font-mono); font-weight: var(--fw-bold); color: var(--c-text-invert-muted); line-height: 1;
            white-space: nowrap; min-width: 40px;
        }
        .card.urgent .qty { color: var(--c-text-invert); }

        .card .product-info { flex: 1; min-width: 0; }
        .card .name {
            font-size: 18px; font-weight: var(--fw-bold); color: var(--c-text-invert); line-height: 1.2;
            word-break: break-word;
        }
        .card .unit-label { font-size: 12px; color: var(--c-text-invert-muted); margin-left: 4px; font-weight: 400;}
        .card.urgent .unit-label { color: rgba(255,255,255,0.6); }

        .card .cooking-badge {
            display: inline-block; background: var(--c-accent-warm); color: var(--c-text-invert);
            font-size: 10px; font-weight: var(--fw-bold); padding: 2px 6px; border-radius: var(--radius-sm);
            text-transform: uppercase; letter-spacing: 0.5px; margin-top: var(--sp-1);
        }

        .card .time-row {
            display: flex; align-items: center; gap: var(--sp-4); 
            font-size: 13px; font-weight: var(--fw-medium);
        }
        .card .elapsed { color: var(--c-text-invert-muted); font-family: var(--font-mono); }
        .card .elapsed span { color: var(--c-warn); }
        .card.urgent .elapsed { color: rgba(255,255,255,0.8); }
        .card.urgent .elapsed span { color: var(--c-text-invert); }

        .card .eta { color: var(--c-accent-warm); font-weight: var(--fw-bold); font-family: var(--font-mono); }
        .card .eta.overdue { color: var(--c-danger); }
        .card.urgent .eta { color: rgba(255,255,255,0.7); }
        .card.urgent .eta.overdue { color: var(--c-text-invert); }

        .card .progress-wrap { margin-top: auto; padding-top: var(--sp-2); }
        .card .progress-bar {
            height: 4px; background: var(--c-border-dark); border-radius: 2px; overflow: hidden;
        }
        .card.urgent .progress-bar { background: rgba(255,255,255,0.1); }
        .card .progress-fill { height: 100%; border-radius: 2px; transition: width 30s linear; }

        .card .actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); padding-top: var(--sp-3); border-top: 1px solid var(--c-border-dark); margin-top: var(--sp-1); }
        .card .actions button {
            border: none; border-radius: 10px;
            font-size: 15px; font-weight: 700; cursor: pointer; height: 56px; min-height: 56px;
            text-transform: uppercase; letter-spacing: 0.5px;
            transition: transform 0.1s, box-shadow 0.1s; font-family: inherit;
            box-shadow: 0 4px 0 var(--c-bg-dark);
        }
        .card .actions button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
        .card .actions .ready-btn {
            background: linear-gradient(180deg, #10b981 0%, #059669 100%);
            color: var(--c-text-invert);
            box-shadow: var(--shadow-btn-3d-dark);
        }
        .card .actions .ready-btn:active { box-shadow: 0 1px 0 rgba(0,0,0,0.4); }
        .card .actions .ready-btn:hover { filter: brightness(1.1); }
        .card .actions .cancel-btn {
            background: #2a2632; color: var(--c-text-invert-muted);
            border: 1px solid var(--c-border-dark);
        }
        .card .actions .cancel-btn:hover { background: var(--c-danger); color: var(--c-text-invert); border-color: var(--c-danger); }

        .ready-strip {
            margin-top: var(--sp-4); padding-top: var(--sp-4);
            border-top: 1px solid var(--c-border-dark);
        }
        .ready-strip-header {
            font-size: 10px; font-weight: var(--fw-bold); text-transform: uppercase; letter-spacing: 1px;
            color: var(--c-accent-warm); margin-bottom: var(--sp-3);
        }
        .ready-strip .ready-pill {
            display: inline-flex; align-items: center; gap: var(--sp-2);
            background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: var(--radius-md);
            padding: var(--sp-2) var(--sp-3); margin: 0 var(--sp-2) var(--sp-2) 0; font-size: 13px;
            font-weight: var(--fw-medium); white-space: nowrap;
        }
        .ready-strip .ready-pill .pill-qty { font-family: var(--font-mono); font-weight: var(--fw-bold); }
        .ready-strip .ready-pill .pill-name { color: var(--c-text-invert); }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 80px 20px; color: var(--c-text-invert-muted); font-size: 14px; }
        .empty-state h4 { color: var(--c-text-invert); font-size: 16px; margin-top: var(--sp-3); }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-border-dark); border-radius: 2px; }

        @media (prefers-reduced-motion: reduce) {
            .card { animation: none !important; }
        }
        
        @media (max-width: 768px) {
            body { padding: var(--sp-3); }
            .grid { grid-template-columns: 1fr; }
            .card .name { font-size: 16px; }
        }
    </style>
</head>
<body>
    <div id="reconnectBanner" class="reconnect-banner">Reconectando ao servidor...</div>
    <h1>DEMANDAS ATIVAS &mdash; TODAS AS ESTAÇÕES</h1>
    <div id="demandsGrid" class="grid"></div>
    <div id="readyStrip" class="ready-strip"></div>

    <script>
        const socket = io({
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000
        });
        let demands = [];
        let timeInterval;
        function playNormalAlert() {
            if (typeof Tone === 'undefined') return;
            Tone.start();
            var synth = new Tone.Synth({
                oscillator: { type: 'triangle' },
                envelope: { attack: 0.003, decay: 0.15, sustain: 0, release: 0.2 }
            }).toDestination();
            synth.volume.value = Tone.gainToDb(0.35);
            var now = Tone.context.currentTime;
            var notes = ['C#5', 'F#5', 'G#5'];
            for (var c = 0; c < 2; c++) {
                for (var i = 0; i < notes.length; i++) {
                    synth.triggerAttackRelease(notes[i], '16n', now + c * 0.40 + i * 0.09);
                }
            }
            setTimeout(function() { synth.dispose(); }, 2000);
        }

        function playUrgentAlert() {
            if (typeof Tone === 'undefined') return;
            Tone.start();
            var now = Tone.context.currentTime;
            var cycleLen = 0.45;
            var freqs = [2000, 2500, 3000];
            for (var c = 0; c < 2; c++) {
                var fm = new Tone.FMSynth({
                    harmonicity: 3.2,
                    modulationIndex: 15,
                    carrier: { type: 'sawtooth' },
                    modulation: { type: 'square' }
                }).toDestination();
                fm.volume.value = Tone.gainToDb(0.4);
                var base = now + c * cycleLen;
                fm.triggerAttackRelease(freqs[0], '64n', base);
                fm.triggerAttackRelease(freqs[1], '64n', base + 0.15);
                fm.triggerAttackRelease(freqs[2], '64n', base + 0.28);
                setTimeout(function(s) { s.dispose(); }, 1500, fm);
            }
        }

        function playStockoutAlert() {
            if (typeof Tone === 'undefined') return;
            Tone.start();
            var fm = new Tone.FMSynth({
                harmonicity: 2.5,
                modulationIndex: 6,
                carrier: { partials: [1, 0.3, 0.1] },
                modulation: { type: 'sine' }
            }).toDestination();
            fm.volume.value = Tone.gainToDb(0.3);
            var now = Tone.context.currentTime;
            var notes = ['C6', 'G5', 'E5', 'C5'];
            for (var c = 0; c < 2; c++) {
                for (var i = 0; i < notes.length; i++) {
                    fm.triggerAttackRelease(notes[i], '8n', now + c * 0.50 + i * 0.11);
                }
            }
            setTimeout(function() { fm.dispose(); }, 2000);
        }

        socket.emit('identify', 'cozinha');

        socket.on('connect', () => {
            document.getElementById('reconnectBanner').style.display = 'none';
            socket.emit('identify', 'cozinha');
            carregarDemandasPendentes();
        });

        socket.on('disconnect', () => {
            document.getElementById('reconnectBanner').style.display = 'block';
        });

        socket.on('reconnect_attempt', () => {
            document.getElementById('reconnectBanner').style.display = 'block';
        });

        function parseDate(dateStr) {
            if (!dateStr) return new Date();
            if (dateStr instanceof Date) return isNaN(dateStr.getTime()) ? new Date() : dateStr;
            if (typeof dateStr === 'number') return new Date(dateStr);
            var s = String(dateStr).trim();
            if (!s) return new Date();
            var d = new Date(s);
            if (!isNaN(d.getTime())) return d;
            d = new Date(s.replace(' ', 'T'));
            if (!isNaN(d.getTime())) return d;
            d = new Date(s.replace(' ', 'T').replace(/([+-]\d{2}):?(\d{2})$/, '') + 'Z');
            if (!isNaN(d.getTime())) return d;
            return new Date();
        }

        function timeAgo(dateStr) {
            const diff = Math.floor((Date.now() - parseDate(dateStr).getTime()) / 1000);
            if (diff < 60) return 'agora';
            const min = Math.floor(diff / 60);
            if (min < 60) return `há ${min}min`;
            const h = Math.floor(min / 60);
            return `há ${h}h${min % 60}m`;
        }

        function etaDisplay(expectedReadyAt) {
            if (!expectedReadyAt) return '';
            const remaining = Math.ceil((parseDate(expectedReadyAt).getTime() - Date.now()) / 60000);
            if (remaining <= 0) return 'ATRASADO';
            if (remaining === 1) return '~1m';
            return `~${remaining}m`;
        }

        function isOverdue(expectedReadyAt) {
            if (!expectedReadyAt) return false;
            return parseDate(expectedReadyAt).getTime() < Date.now();
        }

        function calcProgress(createdAt, expectedReadyAt) {
            if (!expectedReadyAt) return null;
            const now = Date.now();
            const start = parseDate(createdAt).getTime();
            const deadline = parseDate(expectedReadyAt).getTime();
            const total = deadline - start;
            if (total <= 0) return 100;
            const elapsed = now - start;
            const pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
            return pct;
        }

        function progressColor(pct, isUrgent) {
            if (pct >= 75) return 'var(--c-danger)';
            if (pct >= 50) return 'var(--c-warn)';
            return isUrgent ? 'var(--c-primary-tint)' : 'var(--c-accent-warm)';
        }

        async function carregarDemandasPendentes() {
            try {
                const response = await fetch('/api/v1/demands');
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                demands = await response.json();
                render();
                document.getElementById('reconnectBanner').style.display = 'none';
            } catch (error) {
                console.error('Falha ao buscar fila do banco:', error);
                if (demands.length === 0) {
                    document.getElementById('reconnectBanner').textContent = 'Erro ao carregar demandas. Tentando novamente...';
                    document.getElementById('reconnectBanner').style.display = 'block';
                    setTimeout(carregarDemandasPendentes, 5000);
                }
            }
        }

        carregarDemandasPendentes();

        function render() {
            const grid = document.getElementById('demandsGrid');
            const readyStrip = document.getElementById('readyStrip');

            const activeDemands = [...demands].filter(d =>
                d.status === 'pending' || d.status === 'ready'
            );

            const pending = activeDemands.filter(d => d.status === 'pending');
            const ready = activeDemands.filter(d => d.status === 'ready');

            const sortedDemands = pending.sort((a, b) => {
                if (a.priority === 'urgent' && b.priority !== 'urgent') return -1;
                if (a.priority !== 'urgent' && b.priority === 'urgent') return 1;
                return parseDate(a.created_at) - parseDate(b.created_at);
            });

            if (sortedDemands.length === 0 && ready.length === 0) {
                grid.innerHTML = '<div class="empty-state"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20"></circle><path d="M16 24l6 6 12-14"></path></svg><h4>Nenhuma demanda ativa</h4><p>Sistema operando nominalmente.</p></div>';
                readyStrip.innerHTML = '';
                return;
            }

            grid.innerHTML = sortedDemands.map(d => {
                const classes = ['card'];
                const overdue = !!(d.expected_ready_at && isOverdue(d.expected_ready_at));
                if (d.priority === 'urgent') classes.push('urgent');
                if (overdue && d.priority === 'urgent') classes.push('critical');
                else if (overdue) classes.push('late');
                if (d.stockout_reported) classes.push('stockout');
                if (d.cooking_started) classes.push('cooking');
                if (d.sla_breached_cozinha || overdue) classes.push('breached');

                const etaText = etaDisplay(d.expected_ready_at);
                const etaClass = overdue ? 'eta overdue' : 'eta';
                const unitText = d.unit_label ? `<span class="unit-label">(${d.unit_label})</span>` : '';
                const cookingBadge = d.cooking_started ? `<span class="cooking-badge">EM PREPARO</span>` : '';
                const urgentLabel = d.priority === 'urgent' ? `<div class="urgent-label">URGENTE</div>` : '';

                const pct = calcProgress(d.created_at, d.expected_ready_at);
                let progressBar = '';
                if (pct !== null) {
                    const color = progressColor(pct, d.priority === 'urgent');
                    progressBar = `<div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color};"></div></div></div>`;
                }

                return `
                <div class="${classes.join(' ')}">
                    ${urgentLabel}
                    <div class="card-top">
                        <div class="qty">${d.quantity}x</div>
                        <div class="product-info">
                            <div class="name">${d.product_name}${unitText}</div>
                            ${cookingBadge}
                        </div>
                    </div>
                    <div class="time-row">
                        <div class="elapsed" data-created="${d.created_at}"><span>${timeAgo(d.created_at)}</span></div>
                        ${etaText ? `<div class="${etaClass}">ETA ${etaText}</div>` : ''}
                    </div>
                    ${progressBar}
                    <div class="actions">
                        <button class="ready-btn" data-id="${d.id}">PRONTO</button>
                        <button class="cancel-btn" data-id="${d.id}">X</button>
                    </div>
                </div>`;
            }).join('');

            if (ready.length > 0) {
                const sortedReady = [...ready].sort((a, b) => parseDate(a.created_at) - parseDate(b.created_at));
                readyStrip.innerHTML =
                    '<div class="ready-strip-header">PRONTO PARA RETIRAR · ' + ready.length + '</div>' +
                    sortedReady.map(d => {
                        const unitText = d.unit_label ? `<span class="pill-unit">${d.unit_label}</span>` : '';
                        return `<div class="ready-pill"><span class="pill-qty">${d.quantity}x</span><span class="pill-name">${d.product_name}</span>${unitText}</div>`;
                    }).join('');
            } else {
                readyStrip.innerHTML = '';
            }

            if (timeInterval) clearInterval(timeInterval);
            timeInterval = setInterval(() => {
                document.querySelectorAll('.elapsed[data-created]').forEach(el => {
                    el.innerHTML = `<span>${timeAgo(el.dataset.created)}</span>`;
                });
                render();
            }, 30000);
        }

        document.addEventListener('click', async (e) => {
            const readyBtn = e.target.closest('.ready-btn');
            const cancelBtn = e.target.closest('.cancel-btn');

            if (readyBtn) {
                const id = readyBtn.dataset.id;
                readyBtn.disabled = true;
                readyBtn.textContent = '...';
                try {
                    await fetch(`/api/v1/demands/${id}/ready`, { method: 'PATCH' });
                } catch (err) {
                    console.error('Erro ao marcar pronto:', err);
                    readyBtn.disabled = false;
                    readyBtn.textContent = 'PRONTO';
                }
            }

            if (cancelBtn) {
                const id = cancelBtn.dataset.id;
                const reason = prompt('Motivo do cancelamento (opcional):');
                cancelBtn.disabled = true;
                cancelBtn.textContent = '...';
                try {
                    await fetch(`/api/v1/demands/${id}/cancel-cozinha`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ reason: reason || null })
                    });
                } catch (err) {
                    console.error('Erro ao cancelar:', err);
                    cancelBtn.disabled = false;
                    cancelBtn.textContent = 'X';
                }
            }
        });

        socket.on('demand:new', (demand) => {
            demands.push(demand);
            render();
            if (typeof Tone !== 'undefined') Tone.start();
            playNormalAlert();
        });

        socket.on('demand:urgent', (demand) => {
            demands.push(demand);
            render();
            if (typeof Tone !== 'undefined') Tone.start();
            playUrgentAlert();
        });

        socket.on('demand:ready', () => { render(); });

        socket.on('demand:retrieved', (updatedDemand) => {
            demands = demands.filter(d => d.id !== updatedDemand.id);
            render();
        });

        socket.on('demand:cancelled', (updatedDemand) => {
            demands = demands.filter(d => d.id !== updatedDemand.id);
            render();
        });

        socket.on('demand:annulled', (updated) => {
            demands = demands.filter(d => d.id !== (updated && updated.id));
            render();
        });

        socket.on('demand:stockout', (updated) => {
            const idx = demands.findIndex(d => d.id === updated.id);
            if (idx !== -1) demands[idx] = updated;
            render();
            if (typeof Tone !== 'undefined') Tone.start();
            playStockoutAlert();
        });

        socket.on('demand:queue-updated', () => {
            carregarDemandasPendentes();
        });
    </script>
</body>
</html>
